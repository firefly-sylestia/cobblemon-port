name: Fabric 26.3 build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fabric-26.3-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Fabric 26.3 mod
        shell: bash
        run: |
          set -o pipefail
          mkdir -p fabric-26.3/build/ci
          bash ./gradlew -p fabric-26.3 build --stacktrace --console=plain 2>&1 | tee fabric-26.3/build/ci/build.log

      - name: Summarize compiler diagnostics
        if: always()
        shell: bash
        run: |
          log=fabric-26.3/build/ci/build.log
          report=fabric-26.3/build/ci/diagnostics.txt
          mkdir -p fabric-26.3/build/ci
          if [[ ! -f "$log" ]]; then
            printf 'Build log was not created. Check earlier workflow steps.\n' > "$report"
          else
            diagnostic_count=$(grep -cE '^e: file://' "$log" || true)
            unique_files=$(grep -E '^e: file://' "$log" | sed -E 's#^e: file://.*/cobblemon-port/cobblemon-port/([^:]+):.*#\1#' | sort -u | wc -l | tr -d ' ' || true)
            {
              echo '# Fabric 26.3 compiler diagnostics'
              echo
              printf 'Compiler diagnostic lines: %s\n' "$diagnostic_count"
              printf 'Affected source files: %s\n' "$unique_files"
              echo
              echo '## Most affected source files'
              grep -E '^e: file://' "$log" | sed -E 's#^e: file://.*/cobblemon-port/cobblemon-port/([^:]+):.*#\1#' | sort | uniq -c | sort -nr | head -n 25 || true
              echo
              echo '## Most repeated diagnostic messages'
              grep -E '^e: file://' "$log" | sed -E 's#^e: file://[^:]+:[0-9]+:[0-9]+ ##' | sort | uniq -c | sort -nr | head -n 25 || true
              echo
              echo '## Build result'
              grep -E '^BUILD (SUCCESSFUL|FAILED)' "$log" | tail -n 1 || true
            } > "$report"
            cat "$report"
          fi
          # Surface the failure in the public check-run summary; downloadable logs require
          # repository write access.
          cat "$report" >> "$GITHUB_STEP_SUMMARY"
          if [[ -f "$log" ]]; then
            # Annotations are readable without repository write access.
            annotation_count=0
            while IFS= read -r line && [[ "$annotation_count" -lt 30 ]]; do
              line=${line//'%'/'%25'}
              line=${line//$'\r'/}
              echo "::error::$line"
              annotation_count=$((annotation_count + 1))              done < <(grep -E '^e: |^FAILURE|^What went wrong|^Caused by|Invalid|widener|Exception|error:' "$log" | head -n 20 || true)
            if [[ "$annotation_count" -eq 0 ]]; then
              while IFS= read -r line && [[ "$annotation_count" -lt 20 ]]; do
                line=${line//'%'/'%25'}
                line=${line//$'\r'/}
                echo "::error::$line"
                annotation_count=$((annotation_count + 1))
              done < <(head -n 20 "$log")
            fi

            {
              echo
              echo '## Build log excerpt'
              echo '```'
              head -n 120 "$log"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Expose diagnostic totals
        if: always()
        shell: bash
        run: |
          report=fabric-26.3/build/ci/diagnostics.txt
          [[ -f "$report" ]] || exit 0
          count=0
          while IFS= read -r line && [[ "$count" -lt 10 ]]; do
            line=${line//'%'/'%25'}
            line=${line//$'\r'/}
            echo "::error::$line"
            count=$((count + 1))
          done < <(grep -E '^(Compiler diagnostic lines:|Affected source files:)' "$report"; grep -E '^ *[0-9]+ ' "$report" | head -n 8)

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fabric-26.3-build-log
          path: |
            fabric-26.3/build/ci/build.log
            fabric-26.3/build/ci/diagnostics.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Upload mod jar
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: cobblemon-fabric-26.3
          path: fabric-26.3/build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
