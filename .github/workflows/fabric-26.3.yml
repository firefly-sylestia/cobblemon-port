name: Fabric 26.3 build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fabric-26.3-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Fabric 26.3 mod
        shell: bash
        run: |
          set -o pipefail
          mkdir -p fabric-26.3/build/ci
          bash ./gradlew -p fabric-26.3 build --stacktrace --console=plain 2>&1 | tee fabric-26.3/build/ci/build.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fabric-26.3-build-log
          path: fabric-26.3/build/ci/build.log
          if-no-files-found: warn
          retention-days: 14

      - name: Upload mod jar
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: cobblemon-fabric-26.3
          path: fabric-26.3/build/libs/*.jar
          if-no-files-found: error
          retention-days: 14